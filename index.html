<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logo</title>
    <style>
      :root {
        --default-bg: #ffffff;
        --fg: rgba(255, 255, 255, 0.92);
        --fg-dim: rgba(255, 255, 255, 0.45);
        --control-bg: rgba(255, 255, 255, 0.08);
        --control-bg-hover: rgba(255, 255, 255, 0.16);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: var(--default-bg);
        overflow: hidden;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
      }

      .viewer {
        position: relative;
        width: 100vw;
        height: 100vh;
      }

      .slide {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--default-bg);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
      }

      .slide.active {
        opacity: 1;
        pointer-events: auto;
      }

      .slide img {
        max-width: 100vw;
        max-height: 100vh;
        width: auto;
        height: auto;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      /* fullscreen toggle */
      .fs-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 10;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--control-bg);
        border: none;
        color: var(--fg);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        transition:
          opacity 0.3s ease,
          background 0.15s ease;
      }
      .viewer.show-ui .fs-btn {
        opacity: 1;
      }
      .fs-btn:hover {
        background: var(--control-bg-hover);
      }
      .fs-btn svg {
        width: 18px;
        height: 18px;
      }

      /* link-out button */
      .link-btn {
        position: absolute;
        bottom: 20px;
        right: 20px;
        z-index: 10;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--control-bg);
        border: none;
        color: var(--fg);
        display: none;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        opacity: 0;
        text-decoration: none;
        transition:
          opacity 0.3s ease,
          background 0.15s ease;
      }
      .link-btn.visible {
        display: flex;
      }
      .viewer.show-ui .link-btn.visible {
        opacity: 1;
      }
      .link-btn:hover {
        background: var(--control-bg-hover);
      }
      .link-btn svg {
        width: 18px;
        height: 18px;
      }

      .empty-state {
        color: var(--fg-dim);
        font-size: 14px;
        text-align: center;
        max-width: 320px;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <div class="viewer show-ui" id="viewer">
      <div id="slides"></div>

      <button class="fs-btn" id="fsBtn" aria-label="Toggle fullscreen">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"
          ></path>
        </svg>
      </button>

      <a
        class="link-btn"
        id="linkBtn"
        aria-label="Open link"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"
          ></path>
          <polyline points="15 3 21 3 21 9"></polyline>
          <line x1="10" y1="14" x2="21" y2="3"></line>
        </svg>
      </a>
    </div>

    <script>
      // ---------------------------------------------------------------------
      // ADD YOUR SLIDES HERE. One entry per slide, in order.
      // `src` is required. `bg` is optional — a CSS color used as the bleed
      // color behind the image if the image's aspect ratio doesn't match the
      // viewport. If omitted, it falls back to black.
      // `link` is optional — a URL. When set, a small link-out icon appears
      // in the bottom-right corner while that slide is showing, and clicking
      // it opens the URL in a new tab.
      // ---------------------------------------------------------------------
      const SLIDES = [
        { src: "slide-01.svg", bg: "#ffffff" },
        { src: "slide-02.svg", bg: "#ffffff" },
        { src: "slide-03.svg", bg: "#ffffff" },
        { src: "slide-04.svg", bg: "#ffffff" },
        { src: "slide-05.svg", bg: "#ffffff" },
        { src: "slide-06.svg", bg: "#ffffff" },
        { src: "slide-07.svg", bg: "#000000" },
        { src: "slide-08.svg", bg: "#ffffff" },
        { src: "slide-09.svg", bg: "#ffffff" },
        { src: "slide-10.svg", bg: "#ffffff" },
        { src: "slide-11.svg", bg: "#000000" },
        { src: "slide-12.svg", bg: "#ffffff" },
        { src: "slide-13.svg", bg: "#ffffff" },
        { src: "slide-14.svg", bg: "#ffffff" },
        { src: "slide-15.svg", bg: "#14101C" },
      ];
      const DEFAULT_BG = "#ffffff";
      // ---------------------------------------------------------------------

      const slidesEl = document.getElementById("slides");
      const viewer = document.getElementById("viewer");
      const fsBtn = document.getElementById("fsBtn");
      const linkBtn = document.getElementById("linkBtn");

      let current = 0;
      let idleTimer = null;

      function buildSlides() {
        if (SLIDES.length === 0) {
          slidesEl.innerHTML = `
        <div class="empty-state">
          No slides yet. Open this file and add slides to the
          <code>SLIDES</code> array at the bottom of the HTML.
        </div>`;
          return;
        }

        SLIDES.forEach((slide, i) => {
          const div = document.createElement("div");
          div.className = "slide" + (i === 0 ? " active" : "");
          div.dataset.index = i;
          div.style.background = slide.bg || DEFAULT_BG;

          const img = document.createElement("img");
          img.src = slide.src;
          img.alt = `Slide ${i + 1}`;
          img.draggable = false;
          div.appendChild(img);
          slidesEl.appendChild(div);
        });

        updateUI();
      }

      function goTo(index) {
        if (SLIDES.length === 0) return;
        if (index < 0 || index >= SLIDES.length) return;

        document.querySelectorAll(".slide")[current].classList.remove("active");

        current = index;

        document.querySelectorAll(".slide")[current].classList.add("active");

        updateUI();
        wakeUI();
      }

      function next() {
        goTo(current + 1);
      }
      function prev() {
        goTo(current - 1);
      }

      function updateUI() {
        const link = SLIDES[current] && SLIDES[current].link;
        if (link) {
          linkBtn.href = link;
          linkBtn.classList.add("visible");
        } else {
          linkBtn.removeAttribute("href");
          linkBtn.classList.remove("visible");
        }
      }

      function wakeUI() {
        viewer.classList.add("show-ui");
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          viewer.classList.remove("show-ui");
        }, 2200);
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
          e.preventDefault();
          next();
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          prev();
        } else if (e.key === "f" || e.key === "F") {
          toggleFullscreen();
        }
        wakeUI();
      });

      ["mousemove", "click", "touchstart"].forEach((evt) => {
        viewer.addEventListener(evt, wakeUI);
      });

      function toggleFullscreen() {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }
      fsBtn.addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFullscreen();
      });

      // simple swipe support for touch devices
      let touchStartX = null;
      viewer.addEventListener(
        "touchstart",
        (e) => {
          touchStartX = e.touches[0].clientX;
        },
        { passive: true },
      );
      viewer.addEventListener("touchend", (e) => {
        if (touchStartX === null) return;
        const dx = e.changedTouches[0].clientX - touchStartX;
        if (Math.abs(dx) > 50) {
          dx < 0 ? next() : prev();
        }
        touchStartX = null;
      });

      buildSlides();
      wakeUI();
    </script>
  </body>
</html>
